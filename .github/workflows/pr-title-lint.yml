# Conventional-commit PR-title lint (issue #499, PRD #498). release-please
# derives the changelog and version bump from the squashed commit subject, which
# on this repo is the PR title — so the title has to be a valid conventional
# commit.
#
# BLOCKING (flipped in HITL slice #504): a non-conventional title turns this
# check red, and "Conventional PR title" is in master's branch-protection
# required status checks — a bad title cannot merge. Agent PR templates emit
# conventional titles (#502 — team-pickup skill + scripts/ralph/ralph-pr.sh,
# both pre-flighting this same validator).
#
# The validator-tests job below is NOT advisory — it is a real test suite for
# the script and must stay blocking.
#
# All the rules live in scripts/validate-pr-title.sh (self-tested); this
# workflow is a thin wrapper. The title is passed through an env var rather than
# inline `${{ }}` interpolation so a crafted title cannot inject shell.

name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'scripts/validate-pr-title.sh'
      - 'scripts/validate-pr-title.test.sh'
      - 'scripts/ralph/ralph-pr.sh'
      - 'scripts/ralph/ralph-pr.test.sh'
      - '.github/workflows/pr-title-lint.yml'

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR title
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/validate-pr-title.sh "$PR_TITLE"

  validator-tests:
    name: Validator self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the PR-title validator test suite
        run: bash scripts/validate-pr-title.test.sh

      # Agent PR-creation path (#502): ralph-pr.sh must build titles this
      # validator accepts, so its suite is gated here alongside the validator's.
      - name: Run the ralph PR-script test suite
        run: bash scripts/ralph/ralph-pr.test.sh
