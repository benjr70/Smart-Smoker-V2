name: Production Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g. v1.2.3 or 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  # Normalize the version from the release event or the manual dispatch input.
  # Both paths converge on the same shape: num = X.Y.Z, tag/ref = vX.Y.Z.
  set-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      num: ${{ steps.version.outputs.num }}
      images_exist: ${{ steps.images.outputs.exist }}

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ inputs.version }}"
          fi
          # Trim whitespace (copy-pasted dispatch inputs often carry a trailing
          # space) and normalize a leading V/v away, mirroring release.yml.
          RAW="$(echo "$RAW" | xargs)"
          NUM="${RAW#[vV]}"
          # Fail fast on a malformed version instead of handing garbage to
          # actions/checkout two reusable-workflow levels down, or minting a
          # malformed Docker tag.
          if [[ ! "$NUM" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${RAW}' — expected X.Y.Z or vX.Y.Z (e.g. 1.6.0 or v1.6.0)"
            exit 1
          fi
          echo "tag=v${NUM}" >> "$GITHUB_OUTPUT"
          echo "num=${NUM}"  >> "$GITHUB_OUTPUT"

      # Immutability guard. `:vX.Y.Z` is meant to be built exactly once, by the
      # release that minted the tag. A workflow_dispatch re-deploy of an
      # already-released version (a rollback, or a re-run after a red smoke job)
      # must NOT rebuild: the rebuild would overwrite an immutable tag with a
      # different image, and because release mode also pushes `:latest` it would
      # drag `:latest` backwards onto the older version. So probe Docker Hub —
      # if both cloud images already exist at this tag, skip the build and
      # deploy exactly the images that are already published.
      - name: Check whether release images already exist
        id: images
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          EXIST=true
          for app in backend frontend; do
            IMAGE="${DOCKERHUB_USERNAME}/smart-smoker-${app}:${TAG}"
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "present: ${IMAGE}"
            else
              echo "absent:  ${IMAGE}"
              EXIST=false
            fi
          done
          docker logout || true
          echo "exist=${EXIST}" >> "$GITHUB_OUTPUT"

  # Build the cloud images FROM THE RELEASE TAG rather than retagging whatever
  # `:nightly` happens to be. Promotion could ship a different commit than the
  # one that was released; building at the tag eliminates that race entirely.
  # Release mode also pushes `:latest` for these images — that is correct for a
  # forward release, and the guard above is what keeps a backwards re-deploy
  # from ever reaching this job.
  publish-cloud:
    name: Build and publish cloud images from tag
    needs: set-version
    if: needs.set-version.outputs.images_exist != 'true'
    uses: ./.github/workflows/publish.yml
    with:
      apps: '["backend", "frontend"]'
      version: ${{ needs.set-version.outputs.num }}
      ref: ${{ needs.set-version.outputs.tag }}
      mode: 'release'
      platforms: 'linux/amd64,linux/arm/v7'
      # The publish job downloads a fresh workspace with no dist/; the backend
      # and frontend Dockerfiles COPY prebuilt output, so build first.
      prebuild: true
    secrets: inherit

  # Deploy runs on the self-hosted proxmox runner (Tailscale access to the prod
  # host). All Docker work happens over SSH on the prod host via deploy-cloud.sh,
  # so this job needs no local Docker — only ssh/scp/node. The `production`
  # environment provides the gate (required reviewers) and prod-scoped secrets.
  deploy:
    name: Deploy to Production
    needs: [set-version, publish-cloud]
    # publish-cloud is skipped when the tag's images already exist (re-deploy of
    # an already-released version). A skipped `needs` would skip this job too, so
    # accept success-or-skipped explicitly — a publish *failure* still blocks.
    if: >-
      ${{ !cancelled()
      && needs.set-version.result == 'success'
      && (needs.publish-cloud.result == 'success'
      || needs.publish-cloud.result == 'skipped') }}
    runs-on: [self-hosted, linux, proxmox]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          unset SSH_AUTH_SOCK || true
          ssh-keyscan -H "${{ vars.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy deployment files to prod host
        run: |
          scp -O -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no \
            cloud.docker-compose.yml \
            root@${{ vars.PROD_HOST }}:${{ vars.PROD_DEPLOY_DIR }}/cloud.docker-compose.yml

          ssh -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no \
            root@${{ vars.PROD_HOST }} \
            "mkdir -p ${{ vars.PROD_DEPLOY_DIR }}/infra/mongodb-init"

          # tar-over-ssh instead of `scp -r dir/.`: modern OpenSSH scp rejects
          # the trailing-dot source ("unexpected filename: .") even with -O.
          tar -C infra/mongodb-init -cf - . | \
            ssh -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no \
              root@${{ vars.PROD_HOST }} \
              "tar -C ${{ vars.PROD_DEPLOY_DIR }}/infra/mongodb-init -xf -"

      - name: Copy deploy helper scripts to prod host
        run: |
          # These were previously scp'd by hand. The deploy/rollback/backup flow
          # on the box depends on them, so ship them automatically every deploy.
          ssh -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no \
            root@${{ vars.PROD_HOST }} \
            "mkdir -p ${{ vars.PROD_DEPLOY_DIR }}/scripts"

          scp -O -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no \
            scripts/deployment-backup.sh \
            scripts/deployment-health-check.sh \
            scripts/rollback.sh \
            root@${{ vars.PROD_HOST }}:${{ vars.PROD_DEPLOY_DIR }}/scripts/

          ssh -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no \
            root@${{ vars.PROD_HOST }} \
            "chmod +x ${{ vars.PROD_DEPLOY_DIR }}/scripts/deployment-backup.sh \
                      ${{ vars.PROD_DEPLOY_DIR }}/scripts/deployment-health-check.sh \
                      ${{ vars.PROD_DEPLOY_DIR }}/scripts/rollback.sh"

      - name: Write prod secrets to .env on prod host
        run: |
          ENCODED_PASSWORD=$(printf '%s' "${{ secrets.MONGO_APP_PASSWORD }}" | jq -sRr @uri)
          printf '%s\n' \
            "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" \
            "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" \
            "MONGO_ROOT_USER=admin" \
            "MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}" \
            "MONGO_APP_PASSWORD=${{ secrets.MONGO_APP_PASSWORD }}" \
            "ENCODED_MONGO_APP_PASSWORD=${ENCODED_PASSWORD}" \
            > /tmp/prod.env
          scp -O -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no \
            /tmp/prod.env \
            "root@${{ vars.PROD_HOST }}:${{ vars.PROD_DEPLOY_DIR }}/.env"
          ssh -i ~/.ssh/id_ed25519 -o PasswordAuthentication=no \
            "root@${{ vars.PROD_HOST }}" \
            "chmod 600 '${{ vars.PROD_DEPLOY_DIR }}/.env'"
          rm -f /tmp/prod.env

      - name: Deploy to production via deploy-cloud.sh
        run: |
          scripts/deploy-cloud.sh \
            "${{ vars.PROD_HOST }}" \
            "${{ vars.PROD_DEPLOY_DIR }}" \
            "cloud.docker-compose.yml" \
            "${{ needs.set-version.outputs.tag }}" \
            "funnel"
        env:
          DEPLOY_WAIT_SECONDS: '120'
          HEALTH_RETRIES: '5'

      - name: Revoke SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      - name: Send Discord notification
        if: always()
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi

          VERSION="${{ needs.set-version.outputs.tag }}"
          JOB_STATUS="${{ job.status }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="Production Deploy Succeeded"
            DESCRIPTION="Version \`${VERSION}\` is live in production."
          else
            COLOR=15158332
            TITLE="Production Deploy FAILED"
            DESCRIPTION="Deploy of \`${VERSION}\` failed — rollback may have been attempted. Manual check required."
          fi

          PAYLOAD=$(jq -n \
            --arg title    "$TITLE" \
            --arg desc     "$DESCRIPTION" \
            --argjson color "$COLOR" \
            --arg version  "$VERSION" \
            --arg status   "$JOB_STATUS" \
            --arg url      "$WORKFLOW_URL" \
            --arg ts       "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
              title: $title,
              description: $desc,
              color: $color,
              fields: [
                {name: "Version",  value: $version, inline: true},
                {name: "Status",   value: $status,  inline: true},
                {name: "Workflow", value: $url,      inline: false}
              ],
              timestamp: $ts
            }]}')

          curl -fsS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Discord notification failed (non-fatal)"

  # Blocking smoke gate. Runs on a GitHub-hosted ubuntu-latest runner so
  # Playwright can install its browser system libs (the self-hosted proxmox
  # runner has no passwordless sudo, which is why #237 had to downgrade smoke to
  # advisory). It hits the PUBLIC funnel URLs, so it needs no Tailscale. A smoke
  # failure fails this job and therefore the whole prod-deploy run — the gate is
  # real again. No Discord step here: the deploy job already notifies, and a
  # failed CI run is sufficient signal.
  smoke:
    name: Post-deploy smoke (blocking)
    needs: [set-version, deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install smoke dependencies
        run: |
          npm --prefix scripts/smoke ci
          npm --prefix scripts/smoke run smoke:install

      - name: Run post-deploy smoke tests against public funnel
        run: |
          npm --prefix scripts/smoke run smoke -- \
            --frontend "https://${{ vars.PROD_FQDN }}" \
            --backend "https://${{ vars.PROD_FQDN }}:8443" \
            --artifacts /tmp/prod-smoke-artifacts

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-deploy-smoke-artifacts
          path: /tmp/prod-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 30
