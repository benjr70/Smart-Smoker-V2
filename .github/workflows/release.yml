# Main release workflow for Smart Smoker v2

name: Release Smart Smoker v2

on:
  # Manual release (existing behavior)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0 or v1.0.0)'
        type: string
        required: true
  # New: auto-run on GitHub Release publish
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Normalize version/ref from workflow_dispatch input or release tag
  set-version:
    runs-on: ubuntu-latest
    outputs:
      version_numeric: ${{ steps.norm.outputs.version_numeric }}
      version_tag: ${{ steps.norm.outputs.version_tag }}
      ref: ${{ steps.norm.outputs.ref }}
    steps:
      - id: norm
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            NUM="${TAG#v}"
            VTAG="v${NUM}"
            REF="$VTAG"
          else
            IN="${{ github.event.inputs.version }}"
            # trim whitespace and normalize leading V to v
            IN="$(echo "$IN" | xargs)"
            IN="${IN/#V/v}"
            NUM="${IN#v}"
            VTAG="v${NUM}"
            # Use the tag ref when a tag exists; otherwise this will checkout the branch/commit if it matches
            REF="$VTAG"
          fi
          echo "version_numeric=$NUM" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VTAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  # Build smoker applications (no Docker)
  build-smoker:
    needs: set-version
    uses: ./.github/workflows/build.yml
    with:
      apps: '["smoker", "device-service", "electron-shell"]'
      mode: 'build'
      ref: ${{ needs.set-version.outputs.ref }}

  # Build and publish smoker Docker images
  publish-smoker:
    needs: [set-version, build-smoker]
    uses: ./.github/workflows/publish.yml
    with:
      apps: '["smoker", "device-service", "electron-shell"]'
      version: ${{ needs.set-version.outputs.version_numeric }}
      ref: ${{ needs.set-version.outputs.ref }}
      mode: 'release'
      platforms: 'linux/amd64,linux/arm/v7'
      # publish.yml's publish job downloads fresh source (publish-workspace) with
      # no dist/ — the smoker/device-service/electron Dockerfiles COPY prebuilt
      # dist, so publish must build it first. nightly.yml already passes this;
      # the release path silently defaulted to false and broke on v1.6.0.
      prebuild: true
    secrets: inherit

  # There is deliberately no deploy job for the smoker devices.
  #
  # Publishing `:latest` above IS the deployment: Watchtower on each device
  # polls that tag and recreates its containers on the next poll after the
  # device is powered on. A push-based deploy is the wrong shape for hardware
  # that is offline most of the time — and the job that used to live here
  # targeted a `Smoker` self-hosted runner that no longer exists, so every
  # release queued for ~24h and reported a false failure.
  #
  # When `smoker.docker-compose.yml` itself changes, dispatch the `Device
  # Deploy` workflow (device_host: smoker, compose_file:
  # smoker.docker-compose.yml, version: latest). Watchtower recreates
  # containers from the running container's config and never re-reads that
  # file. See docs/CI-CD/smoker-device.md.
