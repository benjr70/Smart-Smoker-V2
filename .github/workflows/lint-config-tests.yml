# Guards the eslint workspace configs against the cwd-relative
# `parserOptions.project` bug (#454). CI lints each app from inside its own
# directory, so a config that only resolves its tsconfig relative to the
# process cwd looks perfectly healthy in CI while every local commit touching
# that app is rejected by the pre-commit hook (lint-staged runs eslint from the
# repo root). scripts/eslint-tsconfig-root.test.sh closes that blind spot: it
# asserts every type-aware config pins `tsconfigRootDir: __dirname` and that a
# root-cwd eslint run parses backend/device-service files. Path-filtered to the
# configs, the hook wiring and the suite itself.

name: Lint Config Tests

on:
  pull_request:
    branches: [master]
    paths:
      # Mirrors the suite's own search scope:
      # `find apps packages e2e -maxdepth 2 -name .eslintrc.js`, plus the root
      # config. Keep the two in lockstep — a config the filter misses is a
      # config the guard never runs against.
      - '.eslintrc.js'
      - 'apps/.eslintrc.js'
      - 'apps/*/.eslintrc.js'
      - 'packages/.eslintrc.js'
      - 'packages/*/.eslintrc.js'
      - 'e2e/.eslintrc.js'
      - 'e2e/*/.eslintrc.js'
      - 'package.json'
      - '.husky/**'
      - 'scripts/eslint-tsconfig-root.test.sh'
      - '.github/workflows/lint-config-tests.yml'
  push:
    branches: [master]
    paths:
      # Mirrors the suite's own search scope:
      # `find apps packages e2e -maxdepth 2 -name .eslintrc.js`, plus the root
      # config. Keep the two in lockstep — a config the filter misses is a
      # config the guard never runs against.
      - '.eslintrc.js'
      - 'apps/.eslintrc.js'
      - 'apps/*/.eslintrc.js'
      - 'packages/.eslintrc.js'
      - 'packages/*/.eslintrc.js'
      - 'e2e/.eslintrc.js'
      - 'e2e/*/.eslintrc.js'
      - 'package.json'
      - '.husky/**'
      - 'scripts/eslint-tsconfig-root.test.sh'
      - '.github/workflows/lint-config-tests.yml'

jobs:
  lint-config-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.7.0'

      - name: Use npm 10
        run: npm i -g npm@10

      - name: Cache Node Modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-

      # The behavioral half of the suite runs the real eslint binary, so the
      # workspace install is required (--legacy-peer-deps per repo convention).
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run eslint config suite
        run: bash scripts/eslint-tsconfig-root.test.sh
