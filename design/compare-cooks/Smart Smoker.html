  text:p.text, sub:p.sub, accent:p.accent, accentBg:p.accent+'1F',
  navBg:p.nav||p.surface, navBorder:p.border,
  inputBg:dark?p.alt:p.bg, inputBorder:p.inputBorder||p.border,
  chip:p.alt, chipActive:p.accent, chipActiveText:p.onAccent||(dark?p.bg:'#FFFFFF'),
  onAccent:p.onAccent||(dark?p.bg:'#FFFFFF'),
  tag:p.alt, tagText:p.sub,
  danger:p.danger, dangerBg:p.danger+'1A',
  shadow:dark?'0 2px 12px rgba(0,0,0,.35)':p.shadow,
  shadowMd:dark?'0 4px 24px rgba(0,0,0,.45)':p.shadowMd,

function genTempData() {
  const pts = [];
  let ch=225, p1=72, p2=68, p3=64;
  for (let i=40; i>=0; i--) {
    ch += (Math.random()-.42)*5; ch=Math.max(215,Math.min(240,ch));
    p1 += Math.random()*2.1;
    p2 += Math.random()*1.8;
    p3 += Math.random()*1.5;
    pts.push({ t: Date.now()-i*3*60*1000, ch:Math.round(ch), p1:Math.round(p1), p2:Math.round(p2), p3:Math.round(p3) });
  }
  return pts;
}

/* ─── SVG TEMP CHART ─────────────────────────────────── */
function TempChart({ data, names, compact, target, events, stamps }) {
  const t = useTheme();
  const W = compact ? 340 : 360, H = compact ? 160 : 200;
  const PAD = { l:44, r:12, t:12, b:28 };
  const dW = W - PAD.l - PAD.r, dH = H - PAD.t - PAD.b;

  if (!data || data.length < 2) return null;

  const vals = data.flatMap(d=>[d.ch,d.p1,d.p2,d.p3]);
  if (target) vals.push(target);
  // round tick values via the same d3 progression the shared chart package uses
  const yMin = Math.floor((Math.min(...vals)-15)/25)*25;
  const yMax = Math.ceil((Math.max(...vals)+15)/25)*25;
  const tMin = data[0].t, tMax = data[data.length-1].t;

  const px = (t) => PAD.l + ((t-tMin)/(tMax-tMin||1))*dW;
  const py = (v) => PAD.t + (1-(v-yMin)/(yMax-yMin))*dH;

  const line = (key) => data.map((d,i)=>`${i===0?'M':'L'}${px(d.t).toFixed(1)},${py(d[key]).toFixed(1)}`).join(' ');
  const ticksY = niceTicks(yMin, yMax, 4);
  const ticksX = [0, Math.floor(data.length/2), data.length-1].map(i=>data[i]);

  const probeLines = [
    {key:'ch', color:t.probes.chamber, name: names.chamber},
    {key:'p1', color:t.probes.p1, name: names.p1},
    {key:'p2', color:t.probes.p2, name: names.p2},
    {key:'p3', color:t.probes.p3, name: names.p3},
  ];

  return (
    <div style={{width:'100%',overflowX:'auto'}}>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block'}}>
        {/* Grid lines */}
        {ticksY.map(v=>(
          <line key={v} x1={PAD.l} y1={py(v)} x2={PAD.l+dW} y2={py(v)}
            stroke={t.border} strokeWidth="1" strokeDasharray="3,3"/>
        ))}
        {/* Y labels */}
        {ticksY.map(v=>(
          <text key={v} x={PAD.l-6} y={py(v)+4} textAnchor="end" fontSize="9"
            fontFamily="Plus Jakarta Sans" fill={t.sub}>{v}°</text>
        ))}
        {/* X labels */}
        {ticksX.map((d,i)=>(
          <text key={i} x={px(d.t)} y={H-6} textAnchor="middle" fontSize="9"
            fontFamily="Plus Jakarta Sans" fill={t.sub}>
            {new Date(d.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
          </text>
        ))}
        {/* Target line */}
        {target && (
          <g>
            <line x1={PAD.l} y1={py(target)} x2={PAD.l+dW} y2={py(target)}
              stroke={t.probes.p1} strokeWidth="1.5" strokeDasharray="5,4" opacity=".6"/>
            <text x={PAD.l+dW} y={py(target)-5} textAnchor="end" fontSize="9" fontWeight="600"
              fontFamily="Plus Jakarta Sans" fill={t.probes.p1} opacity=".85">TARGET {target}°</text>
          </g>
        )}
        {/* Lines */}
        {probeLines.map(({key,color})=>(
          <path key={key} d={key==='ch'
              ? cardinalPath(data.map(d=>[px(d.t),py(d[key])]))   /* chamber is curveCardinal in the source */
              : linearPath(data.map(d=>[px(d.t),py(d[key])]))}
            fill="none" stroke={color} strokeWidth="2"
            strokeLinejoin="round" strokeLinecap="round"/>
        ))}
        {/* Latest dots */}
        {probeLines.map(({key,color})=>{
          const last = data[data.length-1];
          return <circle key={key} cx={px(last.t)} cy={py(last[key])} r="3" fill={color}/>;
        })}
        {/* Cook-log event markers */}
        {(events||[]).filter(e=>e.t>=tMin).map(e=>{
          const s = findStamp(stamps, e.type);
          const c = toneColor(t, s.tone), x = px(Math.min(e.t, tMax));
          return (
            <g key={e.id}>
              <line x1={x} y1={PAD.t+9} x2={x} y2={PAD.t+dH} stroke={c} strokeWidth="1.2" strokeDasharray="2,3" opacity=".7"/>
              <circle cx={x} cy={PAD.t+5} r="6" fill={c}/>
              <text x={x} y={PAD.t+8.2} textAnchor="middle" fontSize="7.5" fontWeight="800"
                fontFamily="Plus Jakarta Sans" fill={t.surface}>{stampShort(s.label)}</text>
            </g>
          );
        })}
      </svg>
      {/* Legend */}
      <div style={{display:'flex',flexWrap:'wrap',gap:'8px 16px',paddingLeft:PAD.l,marginTop:2}}>
        {probeLines.map(({key,color,name})=>(
          <div key={key} style={{display:'flex',alignItems:'center',gap:5}}>
            <div style={{width:10,height:10,borderRadius:'50%',background:color,flexShrink:0}}></div>
            <span style={{fontSize:11,color:t.sub,fontWeight:500}}>{name}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── SHARED COMPONENTS ─────────────────────────────── */
function Card({ children, style, ...rest }) {
  const t = useTheme();
  return <div {...rest} style={{background:t.surface,borderRadius:16,boxShadow:t.shadow,overflow:'hidden',...style}}>{children}</div>;
}

function Input({ label, value, onChange, type='text', multiline, rows=3, hint, style }) {
  const t = useTheme();
  const base = {
    width:'100%', background:t.inputBg, border:`1.5px solid ${t.inputBorder}`,
    borderRadius:10, padding:'12px 14px', fontSize:15, color:t.text,
    outline:'none', fontFamily:'inherit', transition:'border .15s',
    resize: multiline ? 'none' : undefined,
  };
  return (
    <div style={{display:'flex',flexDirection:'column',gap:5,...style}}>
      {label && <label style={{fontSize:12,fontWeight:600,color:t.sub,letterSpacing:.4}}>{label.toUpperCase()}</label>}
      {multiline
        ? <textarea value={value} onChange={e=>onChange(e.target.value)} rows={rows} style={base}/>
        : <input type={type} value={value} onChange={e=>onChange(e.target.value)} style={base}/>
      }
      {hint && <span style={{fontSize:11,color:t.sub}}>{hint}</span>}
    </div>
  );
}

function Btn({ children, onClick, variant='primary', size='md', style }) {
  const t = useTheme();
  const [hov, setHov] = useState(false);
  const styles = {
    primary: { background: t.accent, filter: hov ? (t.isDark?'brightness(1.12)':'brightness(.9)') : 'none', color:t.onAccent },
    secondary: { background: hov ? t.surfaceAlt : t.accentBg, color: t.accent },
    ghost: { background: hov ? t.surfaceAlt : 'transparent', color: t.text, border:`1.5px solid ${t.border}` },
    danger: { background: hov ? t.danger : t.dangerBg, color: hov?(t.isDark?t.bg:'#fff'):t.danger },
  };
  const sz = { sm:{padding:'7px 14px',fontSize:13}, md:{padding:'11px 20px',fontSize:14}, lg:{padding:'14px 24px',fontSize:16} };
  return (
    <button onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{cursor:'pointer',border:'none',borderRadius:10,fontFamily:'inherit',fontWeight:600,
        transition:'all .15s',...sz[size],...styles[variant],...style}}>
      {children}
    </button>
  );
}

function StepTabs({ steps, active, onChange }) {
  const t = useTheme();
  return (
    <div style={{display:'flex',gap:4,background:t.surfaceAlt,padding:4,borderRadius:12}}>
      {steps.map((s,i)=>(
        <button key={i} onClick={()=>onChange(i)} style={{
          flex:1, padding:'8px 4px', fontSize:12, fontWeight:600, fontFamily:'inherit',
          border:'none', borderRadius:9, cursor:'pointer', transition:'all .2s',
          background: active===i ? t.surface : 'transparent',
          color: active===i ? t.accent : t.sub,
          boxShadow: active===i ? t.shadow : 'none',
        }}>{s}</button>
      ))}
    </div>
  );
}

function TempRow({ label, value, color, editable, onLabelChange, last }) {
  const t = useTheme();
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(label);
  return (
    <div style={{display:'flex',alignItems:'center',padding:'12px 0',borderBottom:last?'none':`1px solid ${t.border}`}}>
      <div style={{width:6,height:6,borderRadius:'50%',background:color,marginRight:10,flexShrink:0}}></div>
      {editable && editing
        ? <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)}
            onBlur={()=>{onLabelChange(draft);setEditing(false);}}
            onKeyDown={e=>e.key==='Enter'&&e.target.blur()}
            style={{flex:1,background:'transparent',border:'none',outline:'none',fontSize:15,
              fontWeight:600,color:color,fontFamily:'inherit'}}/>
        : <span onClick={()=>editable&&setEditing(true)}
            style={{flex:1,fontSize:15,fontWeight:600,color:color,
              cursor:editable?'text':'default',userSelect:'none'}}>{label}</span>
      }
      <span style={{fontSize:22,fontWeight:800,color:t.text,letterSpacing:-1,minWidth:64,textAlign:'right'}}>{value}°</span>
      <span style={{fontSize:13,color:t.sub,marginLeft:2,alignSelf:'flex-end',marginBottom:3}}>F</span>
    </div>
  );
}

function DynamicList({ label, items, onChange }) {
  const t = useTheme();
  return (
    <div style={{display:'flex',flexDirection:'column',gap:4}}>
      {label && <label style={{fontSize:12,fontWeight:600,color:t.sub,letterSpacing:.4}}>{label.toUpperCase()}</label>}
      {items.map((item,i)=>(
        <div key={i} style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:13,color:t.sub,minWidth:18,textAlign:'right'}}>{i+1}.</span>
          <input value={item} onChange={e=>{const n=[...items];n[i]=e.target.value;onChange(n);}}
            style={{flex:1,background:t.inputBg,border:`1.5px solid ${t.inputBorder}`,borderRadius:8,
              padding:'9px 12px',fontSize:14,color:t.text,fontFamily:'inherit',outline:'none'}}/>
          <button onClick={()=>onChange(items.filter((_,j)=>j!==i))}
            style={{background:t.dangerBg,border:'none',borderRadius:7,width:30,height:30,cursor:'pointer',
              color:t.danger,fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
        </div>
      ))}
      <button onClick={()=>onChange([...items,''])}
        style={{alignSelf:'flex-start',background:t.accentBg,border:'none',borderRadius:8,padding:'7px 14px',
          fontSize:12,fontWeight:600,color:t.accent,cursor:'pointer',fontFamily:'inherit',marginTop:2}}>
        + Add Step
      </button>
    </div>
  );
}

/* ─── ETA / COMPLETION ESTIMATE ─────────────────────── */
const SAMPLE_MIN = 3; // temps are logged every 3 minutes

function estimate({ data, target, smoking }) {
  const n = Math.min(10, data.length - 1);
  if (n < 2) return { state:'warming' };
  const cur = data[data.length-1].p1;
  const prev = data[data.length-1-n].p1;
  const hours = (n * SAMPLE_MIN) / 60;
  const rate = (cur - prev) / hours; // °F per hour
  if (cur >= target) return { state:'done', cur, rate };
  if (!smoking) return { state:'paused', cur, rate };
  if (rate < 1.5) return { state:'stalled', cur, rate };
  const hoursLeft = (target - cur) / rate;
  return { state:'ok', cur, rate, hoursLeft, eta: new Date(Date.now() + hoursLeft*3600*1000) };
}

function CompletionCard({ data, target, onTarget, smoking, probeName }) {
  const t = useTheme();
  const e = estimate({ data, target, smoking });
  const start = data[0].p1;
  const pct = Math.max(0, Math.min(100, ((e.cur - start) / (target - start)) * 100));

  const fmtDur = h => {
    const m = Math.round(h*60);
    return m < 60 ? `${m}m` : `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;
  };
  const headline = {
    ok: e.eta && e.eta.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}),
    done: 'Ready now',
    stalled: 'Holding',
    paused: 'Paused',
    warming: 'Calculating',
  }[e.state];
  const detail = {
    ok: e.hoursLeft ? `~${fmtDur(e.hoursLeft)} remaining` : '',
    done: `${probeName} reached ${target}\u00b0F`,
    stalled: 'Temp plateaued — the stall is normal',
    paused: 'Resume smoking to estimate',
    warming: 'Gathering temperature data',
  }[e.state];
  const tone = e.state==='done' ? t.ok : e.state==='ok' ? t.text : t.sub;

  return (
    <Card style={{padding:'14px 16px 16px',marginBottom:12}}>
      <div>
        <div style={{fontSize:11,fontWeight:600,color:t.sub,letterSpacing:.5,marginBottom:4}}>ESTIMATED COMPLETION</div>
        <div style={{fontSize:28,fontWeight:800,color:tone,letterSpacing:-.9,lineHeight:1.1,fontVariantNumeric:'tabular-nums'}}>{headline}</div>
        <div style={{fontSize:13,color:t.sub,marginTop:3}}>{detail}</div>
      </div>
      {/* Target temp */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,
        marginTop:14,paddingTop:14,borderTop:`1px solid ${t.border}`}}>
        <div style={{fontSize:13,fontWeight:600,color:t.sub}}>Target temp</div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {[['\u2212',-1],['+',1]].map(([g,d])=>(
            <button key={g} onClick={()=>onTarget(Math.max(100,Math.min(300,target+d)))} aria-label={d<0?'Decrease target':'Increase target'}
              style={{order:d<0?0:2,width:44,height:44,border:`1.5px solid ${t.inputBorder}`,background:t.inputBg,
                borderRadius:11,cursor:'pointer',color:t.text,fontSize:19,fontWeight:600,fontFamily:'inherit',
                display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1,padding:0}}>{g}</button>
          ))}
          <div style={{order:1,display:'flex',alignItems:'baseline',gap:2,background:t.inputBg,
            border:`1.5px solid ${t.inputBorder}`,borderRadius:11,height:44,padding:'0 12px'}}>
            <input type="number" value={target} onChange={ev=>onTarget(Math.max(100,Math.min(300,+ev.target.value||0)))}
              style={{width:52,height:42,background:'transparent',border:'none',outline:'none',fontSize:19,fontWeight:700,
                color:t.text,fontFamily:'inherit',textAlign:'right'}}/>
            <span style={{fontSize:13,color:t.sub}}>°F</span>
          </div>
        </div>
      </div>
      {/* Progress */}
      <div style={{marginTop:14}}>
        <div style={{height:8,borderRadius:4,background:t.surfaceAlt,overflow:'hidden'}}>
          <div style={{width:`${pct}%`,height:'100%',borderRadius:4,
            background:e.state==='done'?t.ok:t.probes.p1,transition:'width .6s ease'}}></div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6}}>
          <span style={{fontSize:12,color:t.sub}}>

          </span>

const nextQuarterHour = (msAhead) => {
  const d = new Date(Date.now() + msAhead);
  d.setMinutes(Math.ceil(d.getMinutes()/15)*15, 0, 0);
  return d.getTime();
};

function LiveSmokeStep({ onNext, template, onPull, features, stamps }) {
  const t = useTheme();
  const [smoking, setSmoking] = useState(true);
  const [names, setNames] = useState({chamber:'Chamber',p1:template?template.meat:'Brisket',p2:'Probe 2',p3:'Probe 3'});
  const [target, setTarget] = useState(template ? template.target : 203);
  const [wood, setWood] = useState(template ? template.wood : 'Post Oak');
  const [notes, setNotes] = useState('');
  const [data, setData] = useState(genTempData);
  const [elapsed, setElapsed] = useState(2*60*60+15*60); // 2h15m in seconds
  const [events, setEvents] = useState([]);
  const [serveAt, setServeAt] = useState(null);
  const [restMin, setRestMin] = useState(60);
  const band = { lo:215, hi:245 };

  const addEvent = (type) => setEvents(prev=>[...prev, {
    id: `${type}-${Date.now()}`, type, t: Date.now(),
    ch: data[data.length-1].ch, p1: data[data.length-1].p1,
  }]);
  const removeEvent = (id) => setEvents(prev=>prev.filter(e=>e.id!==id));

  useEffect(()=>{
    if (!smoking) return;
    const iv = setInterval(()=>{
      setData(prev=>{
        const last = prev[prev.length-1];
        const ch = Math.max(215,Math.min(242,last.ch+(Math.random()-.42)*4));
        // keep floats so sub-degree climb accumulates; rounded only for display
        const p1 = Math.min(target,last.p1+(Math.random()*0.55));
        const p2 = Math.min(203,last.p2+(Math.random()*0.45));
        const p3 = Math.min(203,last.p3+(Math.random()*0.4));
        return [...prev.slice(-59),{t:Date.now(),ch,p1,p2,p3}];
      });
      setElapsed(e=>e+3);
    },3000);
    return ()=>clearInterval(iv);
  },[smoking,target]);

  const last = data[data.length-1];
  const est = estimate({ data, target, smoking });
  const readyAt = est.eta ? est.eta.getTime() : null;
  // seed the serve target off the first real estimate: ready + rest + a little cushion
  useEffect(()=>{
    if (serveAt == null && readyAt) {
      const d = new Date(readyAt + restMin*60*1000 + 30*60*1000);
      d.setMinutes(Math.ceil(d.getMinutes()/15)*15, 0, 0);
      setServeAt(d.getTime());
    }
  },[readyAt, serveAt, restMin]);
  const fmtTime = s => `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  return (
    <div style={{padding:'0 16px 24px',display:'flex',flexDirection:'column',gap:0}}>
      {/* Status bar */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',marginBottom:4}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:smoking?t.ok:t.sub,
            boxShadow:smoking?`0 0 0 3px ${t.ok}33`:undefined,animation:smoking?'pulse 2s infinite':undefined}}></div>
          <span style={{fontSize:13,fontWeight:600,color:smoking?t.ok:t.sub}}>{smoking?'Smoking':'Paused'}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:13,color:t.sub}}>Elapsed</span>
          <span style={{fontSize:14,fontWeight:700,color:t.text,fontVariantNumeric:'tabular-nums'}}>{fmtTime(elapsed)}</span>
        </div>
      </div>
      {/* Estimated completion */}
      <CompletionCard data={data} target={target} onTarget={setTarget} smoking={smoking} probeName={names.p1}/>
      {/* Backwards plan from serve time */}
      {serveAt && (!features || features.servePlan) && <ServePlanCard serveAt={serveAt} onServeAt={setServeAt} restMin={restMin} onRestMin={setRestMin}
        readyAt={readyAt} cur={last.p1} wrapLogged={events.some(e=>e.type==='wrap')}
        driftAlert={!features || features.driftAlert} driftMin={features ? features.driftMin : 30}/>}
      {/* Fire quality */}
      <FireQualityCard data={data} band={band} events={events} onLogWood={()=>addEvent('wood')}/>
      {/* Temp rows */}
      <Card style={{padding:'4px 16px',marginBottom:12}}>
        <TempRow label={names.chamber} value={Math.round(last.ch)} color={t.probes.chamber} editable onLabelChange={v=>setNames({...names,chamber:v})}/>
        <TempRow label={names.p1} value={Math.round(last.p1)} color={t.probes.p1} editable onLabelChange={v=>setNames({...names,p1:v})}/>
        <TempRow label={names.p2} value={Math.round(last.p2)} color={t.probes.p2} editable onLabelChange={v=>setNames({...names,p2:v})}/>
        <TempRow label={names.p3} value={Math.round(last.p3)} color={t.probes.p3} editable onLabelChange={v=>setNames({...names,p3:v})} last/>
      </Card>
      {/* Chart */}
      <Card style={{padding:'16px 12px 12px',marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:600,color:t.sub,letterSpacing:.4,marginBottom:8,paddingLeft:4}}>TEMPERATURE HISTORY</div>
        <TempChart data={data} names={names} target={target} events={events} stamps={stamps}/>
      </Card>
      {/* Cook log */}
      <EventLog events={events} onAdd={addEvent} onRemove={removeEvent} stamps={stamps}/>
      {/* Controls */}
      <div style={{display:'flex',gap:10,marginBottom:14}}>
        <Btn onClick={()=>setSmoking(s=>!s)} variant={smoking?'danger':'primary'} style={{flex:1}}>
          {smoking?'⏸ Stop Smoking':'▶ Start Smoking'}
        </Btn>
      </div>
      <Select label="Wood Type" value={wood} onChange={setWood}
        options={['Post Oak','Hickory','Pecan','Apple','Cherry','Mesquite']}/>
      <div style={{height:10}}/>
      <Input label="Notes" value={notes} onChange={setNotes} multiline rows={3}/>
      <div style={{display:'flex',justifyContent:'flex-end',paddingTop:8}}>
        <Btn onClick={()=>onNext({pullTemp:Math.round(last.p1),restMin,weightLb:template?+template.weight:14})}>Next: Post-Smoke →</Btn>
      </div>
      <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}`}</style>
    </div>
  );
}

function ConfirmDelete({ item, onCancel, onConfirm }) {

function TempRangeSlider({ min, max, lo, hi, onChange }) {
  const t = useTheme();
  const ref = React.useRef(null);
  const activeRef = React.useRef(null);
  const pos = (v) => ((v - min) / (max - min)) * 100;

  const valueAt = (clientX) => {
    const r = ref.current.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    return Math.round(min + pct * (max - min));
  };
  const apply = (clientX) => {
    const v = valueAt(clientX);
    const which = activeRef.current || (Math.abs(v - lo) <= Math.abs(v - hi) ? 'lo' : 'hi');
    activeRef.current = which;
    if (which === 'lo') onChange(Math.min(v, hi - 5), hi);
    else onChange(lo, Math.max(v, lo + 5));
  };

  const Thumb = ({ value, side }) => (
    <div role="slider" aria-label={side==='lo'?'Minimum chamber temperature':'Maximum chamber temperature'}
      aria-valuenow={value} aria-valuemin={min} aria-valuemax={max} tabIndex={0}
      onKeyDown={e=>{
        const d = e.key==='ArrowRight' ? 1 : e.key==='ArrowLeft' ? -1 : 0;
        if(!d) return; e.preventDefault();
        if(side==='lo') onChange(Math.max(min,Math.min(value+d,hi-5)), hi);
        else onChange(lo, Math.min(max,Math.max(value+d,lo+5)));
      }}
      style={{position:'absolute',left:`${pos(value)}%`,top:'50%',transform:'translate(-50%,-50%)',
        width:28,height:28,borderRadius:'50%',background:t.surface,border:`3px solid ${t.accent}`,
        boxShadow:t.shadow,cursor:'grab',touchAction:'none',outline:'none',zIndex:2}}></div>
  );

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:14}}>
        <div style={{fontSize:13,color:t.sub,fontWeight:500}}>Acceptable chamber range</div>
        <div style={{fontSize:15,fontWeight:800,color:t.text,fontVariantNumeric:'tabular-nums'}}>{lo}° – {hi}°F</div>
      </div>
      <div ref={ref} style={{position:'relative',height:28,touchAction:'none'}}
        onPointerDown={e=>{apply(e.clientX);try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}}}
        onPointerMove={e=>{if(e.currentTarget.hasPointerCapture&&e.currentTarget.hasPointerCapture(e.pointerId))apply(e.clientX);}}
        onPointerUp={()=>{activeRef.current=null;}}
        onPointerCancel={()=>{activeRef.current=null;}}>
        <div style={{position:'absolute',left:0,right:0,top:'50%',transform:'translateY(-50%)',
          height:6,borderRadius:3,background:t.surfaceAlt,border:`1px solid ${t.border}`}}></div>
        <div style={{position:'absolute',left:`${pos(lo)}%`,width:`${pos(hi)-pos(lo)}%`,top:'50%',
          transform:'translateY(-50%)',height:6,borderRadius:3,background:t.accent}}></div>
        <Thumb value={lo} side="lo"/>
        <Thumb value={hi} side="hi"/>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}>
        <span style={{fontSize:11,color:t.sub}}>{min}°</span>
        <span style={{fontSize:11,color:t.sub}}>{max}°</span>
      </div>
      {/* numeric entry */}
      <div style={{display:'flex',gap:10,marginTop:14}}>
        {[['Min',lo,'lo'],['Max',hi,'hi']].map(([label,val,side])=>(
          <div key={side} style={{flex:'1 1 0',minWidth:0,display:'flex',flexDirection:'column',gap:5}}>
            <label style={{fontSize:10,fontWeight:700,color:t.sub,letterSpacing:.5}}>{label.toUpperCase()} °F</label>
            <input type="number" value={val}
              onChange={e=>{
                const v = +e.target.value || 0;
                if (side==='lo') onChange(Math.max(min,Math.min(v,hi-5)), hi);
                else onChange(lo, Math.min(max,Math.max(v,lo+5)));
              }}
              style={{width:'100%',minWidth:0,boxSizing:'border-box',height:44,background:t.inputBg,
                border:`1.5px solid ${t.inputBorder}`,borderRadius:11,padding:'0 12px',fontSize:16,fontWeight:700,
                color:t.text,fontFamily:'inherit',outline:'none',textAlign:'center'}}/>
          </div>
        ))}
      </div>
    </div>
  );
}

              on={features.driftAlert} onChange={v=>onFeature('driftAlert',v)} last={!features.driftAlert}/>
            {features.driftAlert && (
              <div style={{padding:'14px 0 18px',animation:'fadeIn .18s ease'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:t.text}}>Tolerance</div>
                    <div style={{fontSize:12,color:t.sub,marginTop:2}}>How far off before it alerts</div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
                    <button onClick={()=>onFeature('driftMin',Math.max(15,features.driftMin-15))} aria-label="Decrease tolerance"
                      style={{width:44,height:44,border:`1.5px solid ${t.inputBorder}`,background:t.inputBg,borderRadius:11,
                        cursor:'pointer',color:t.text,fontSize:19,fontWeight:600,fontFamily:'inherit',lineHeight:1,padding:0}}>−</button>
                    <div style={{minWidth:74,textAlign:'center',fontSize:17,fontWeight:700,color:t.text,fontVariantNumeric:'tabular-nums'}}>
                      {fmtMins(features.driftMin)}
                    </div>
                    <button onClick={()=>onFeature('driftMin',Math.min(180,features.driftMin+15))} aria-label="Increase tolerance"
                      style={{width:44,height:44,border:`1.5px solid ${t.inputBorder}`,background:t.inputBg,borderRadius:11,
                        cursor:'pointer',color:t.text,fontSize:19,fontWeight:600,fontFamily:'inherit',lineHeight:1,padding:0}}>+</button>
                  </div>
                </div>
                <div style={{fontSize:12,color:t.sub,marginTop:14,lineHeight:1.5}}>
                  You'll be notified if the cook runs more than <strong style={{color:t.text,fontWeight:700}}>{fmtMins(features.driftMin)}</strong> behind
                  or finishes more than <strong style={{color:t.text,fontWeight:700}}>{fmtMins(features.driftMin)}</strong> early.
                </div>
              </div>
            )}
          </div>
        )}
      </Card>
      <Card style={{padding:'4px 16px'}}>
        <StampEditor stamps={stamps} onChange={onStamps}/>
      </Card>
      <Card style={{padding:'4px 16px'}}>
        <div style={{fontSize:12,fontWeight:600,color:t.sub,letterSpacing:.4,padding:'14px 0 10px'}}>NOTIFICATIONS</div>
        <Toggle label="Temperature Alert" hint="Alert when chamber goes out of range" on={notifs.tempAlert} onChange={v=>setNotifs({...notifs,tempAlert:v})}/>
        {notifs.tempAlert && (
          <div style={{padding:'14px 0 18px',borderBottom:`1px solid ${t.border}`,
            opacity:1,animation:'fadeIn .18s ease'}}>
            <TempRangeSlider min={150} max={350} lo={range.lo} hi={range.hi}
              onChange={(lo,hi)=>setRange({lo,hi})}/>
            <div style={{fontSize:12,color:t.sub,marginTop:14,lineHeight:1.5}}>
              You'll be notified if the chamber drops below <strong style={{color:t.text,fontWeight:700}}>{range.lo}°F</strong> or
              climbs above <strong style={{color:t.text,fontWeight:700}}>{range.hi}°F</strong>.
            </div>
          </div>
        )}
        <Toggle label="Probe Target Reached" hint="Alert when meat hits target temp" on={notifs.probeTarget} onChange={v=>setNotifs({...notifs,probeTarget:v})}/>
        {notifs.probeTarget && (
          <div style={{padding:'14px 0 18px',borderBottom:`1px solid ${t.border}`,animation:'fadeIn .18s ease'}}>
            <div style={{fontSize:11,fontWeight:700,color:t.sub,letterSpacing:.5,marginBottom:10}}>WATCHED PROBES</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {probes.map(p=>{
                const isPrimary = watched.length>0 && watched[0].key===p.key;
                return (
                  <div key={p.key} style={{display:'flex',alignItems:'center',gap:10,
                    background:p.on?t.surfaceAlt:'transparent',border:`1.5px solid ${p.on?'transparent':t.border}`,
                    borderRadius:12,padding:'8px 10px 8px 8px',transition:'background .15s'}}>
                    {/* enable */}
                    <button onClick={()=>setProbe(p.key,{on:!p.on})} aria-pressed={p.on}
                      aria-label={`${p.on?'Stop watching':'Watch'} ${p.name}`}
                      style={{width:44,height:44,flexShrink:0,border:'none',background:'transparent',cursor:'pointer',
                        display:'flex',alignItems:'center',justifyContent:'center',borderRadius:10,padding:0}}>
                      <div style={{width:22,height:22,borderRadius:7,display:'flex',alignItems:'center',justifyContent:'center',
                        background:p.on?t.probes[p.key]:'transparent',
                        border:p.on?'none':`1.8px solid ${t.inputBorder}`,transition:'all .15s'}}>
                        {p.on && (
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                            <path d="M5 12.5l4.5 4.5L19 7.5" stroke={t.isDark?t.bg:'#fff'} strokeWidth="3"
                              strokeLinecap="round" strokeLinejoin="round"/>
                          </svg>
                        )}
                      </div>
                    </button>
                    {/* name */}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span style={{fontSize:14,fontWeight:600,color:p.on?t.text:t.sub}}>{p.name}</span>
                        {isPrimary && (
                          <span style={{fontSize:9,fontWeight:800,letterSpacing:.5,color:t.accent,
                            background:t.accentBg,borderRadius:5,padding:'2px 5px'}}>ETA</span>
                        )}
                      </div>
                      <div style={{fontSize:11,color:t.sub,marginTop:1}}>
                        {p.on ? (isPrimary ? 'Drives the completion estimate' : 'Alert only') : 'Not watched'}
                      </div>
                    </div>
                    {/* target temp */}
                    <div style={{display:'flex',alignItems:'center',gap:2,flexShrink:0,opacity:p.on?1:.45,
                      background:t.inputBg,border:`1.5px solid ${t.inputBorder}`,borderRadius:10,height:44,padding:'0 10px'}}>
                      <input type="number" value={p.target} disabled={!p.on}
                        onChange={e=>setProbe(p.key,{target:Math.max(100,Math.min(300,+e.target.value||0))})}
                        aria-label={`${p.name} target temperature`}
                        style={{width:42,background:'transparent',border:'none',outline:'none',fontSize:16,fontWeight:700,
                          color:t.text,fontFamily:'inherit',textAlign:'right'}}/>
                      <span style={{fontSize:12,color:t.sub}}>°F</span>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:12,color:t.sub,marginTop:12,lineHeight:1.5}}>
              {watched.length === 0
                ? 'Select at least one probe to receive target alerts.'
                : <>Alerting on <strong style={{color:t.text,fontWeight:700}}>{watched.map(p=>p.name).join(' and ')}</strong>. Probe names carry over from the active smoke.</>}
            </div>
          </div>
        )}
        <Toggle label="Smoke Complete" hint="Alert when session is finished" on={notifs.smokeComplete} onChange={v=>setNotifs({...notifs,smokeComplete:v})} last/>
      </Card>
      <Card style={{padding:'16px'}}>
        <div style={{fontSize:12,fontWeight:600,color:t.sub,letterSpacing:.4,marginBottom:4}}>DEFAULT TARGET TEMPS (°F)</div>
        <div style={{fontSize:12,color:t.sub,marginBottom:14,lineHeight:1.5}}>
          Presets used to seed a probe's target when you start a smoke. Per-probe targets above always win.
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {[['Brisket / Beef','brisket'],['Pork','pork'],['Poultry','poultry']].map(([label,key])=>(
            <div key={key} style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:14,color:t.text}}>{label}</span>
              <input value={targets[key]} onChange={e=>setTargets({...targets,[key]:e.target.value})} type="number"
                style={{width:72,textAlign:'center',background:t.inputBg,border:`1.5px solid ${t.inputBorder}`,
                  borderRadius:8,padding:'7px',fontSize:14,fontWeight:600,color:t.text,fontFamily:'inherit',outline:'none'}}/>
            </div>
          ))}
        </div>
      </Card>
      <Card style={{padding:'16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontSize:14,color:t.sub}}>Version</span>
          <span style={{fontSize:14,fontWeight:600,color:t.text}}>2.4.1</span>
        </div>
      </Card>
    </div>
  );
}

/* ─── MAIN APP ───────────────────────────────────────── */
function useSystemDark() {
  const mq = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  const [dark, setDark] = useState(()=>{ const m = mq(); return m ? m.matches : false; });
  useEffect(()=>{
    const m = mq();
    if (!m) return;
    const on = e => setDark(e.matches);
    m.addEventListener ? m.addEventListener('change', on) : m.addListener(on);
    return () => m.removeEventListener ? m.removeEventListener('change', on) : m.removeListener(on);
  },[]);
  return dark;
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mode": "dark",
  "density": "compact",
  "palette": "carbon"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('smoke');
  const [template, setTemplate] = useState(null);
  const [sessionKey, setSessionKey] = useState(0);
  const [features, setFeatures] = useState({servePlan:true, driftAlert:true, driftMin:30});
  const setFeature = (k,v) => setFeatures(prev=>({...prev,[k]:v}));
  const [stamps, setStamps] = useState(()=>{
    try {
      const raw = localStorage.getItem('smartSmoker.stamps');
      const list = raw && JSON.parse(raw);
      if (Array.isArray(list) && list.length) return list;
    } catch (e) {}
    return DEFAULT_STAMPS.map(s=>({...s}));
  });
  // the pit display mirrors this list, so publish every change
  useEffect(()=>{
    try { localStorage.setItem('smartSmoker.stamps', JSON.stringify(stamps)); } catch (e) {}
  },[stamps]);
  const [sessions, setSessions] = useState(genHistoryData);
  const patchSession = (id, patch) =>
    setSessions(prev => prev.map(i => i.id===id ? {...i, ...patch} : i));
  const deleteSession = (id) => setSessions(prev => prev.filter(i => i.id !== id));
  const pal = PALETTES[tweaks.palette] || PALETTES.slate;
  const systemDark = useSystemDark();
  const mode = tweaks.mode || 'system';
  const isDark = mode === 'system' ? systemDark : mode === 'dark';
  const theme = isDark ? pal.dark : pal.light;

  useEffect(()=>{
    document.documentElement.style.background = theme.bg;
    document.body.style.background = theme.bg;
    document.documentElement.style.colorScheme = theme.isDark ? 'dark' : 'light';
  },[theme]);

  return (
    <ThemeCtx.Provider value={theme}>
      <div style={{background:theme.bg,display:'flex',flexDirection:'column',
        maxWidth:480,width:'100%',margin:'0 auto',position:'relative',
        height:'100dvh',minHeight:'100dvh'}}>
        <div style={{flex:1,overflowY:'auto'}}>
          {screen==='smoke' && <SmokeScreen key={sessionKey} template={template} features={features} stamps={stamps} onGoHistory={()=>{setTemplate(null);setScreen('history');}}/>}
          {screen==='history' && <HistoryScreen items={sessions} onPatch={patchSession} onDelete={deleteSession}
            onCookAgain={tpl=>{setTemplate(tpl);setSessionKey(k=>k+1);setScreen('smoke');}}/>}
          {screen==='stats' && <StatsScreen items={sessions}/>}
          {screen==='settings' && <SettingsScreen mode={mode} onMode={v=>setTweak('mode',v)} systemDark={systemDark}
            features={features} onFeature={setFeature} stamps={stamps} onStamps={setStamps}/>}
        </div>
        <BottomNav screen={screen} setScreen={setScreen}/>
      </div>
      <TweaksPanel>
        <TweakSection label="Appearance"/>
        <TweakSelect label="Color theme" value={tweaks.palette}
          options={Object.keys(PALETTES).map(k=>({value:k,label:PALETTES[k].name}))}
          onChange={v=>setTweak('palette',v)}/>
        <TweakRadio label="Appearance" value={mode} options={['light','dark','system']} onChange={v=>setTweak('mode',v)}/>
        <TweakSection label="Layout Density"/>
        <TweakRadio label="Density" value={tweaks.density} options={['airy','compact']} onChange={v=>setTweak('density',v)}/>
      </TweaksPanel>
    </ThemeCtx.Provider>
  );
}

Object.assign(window, { useTheme, ThemeCtx, Card, Btn, Input, Select, Chip, StarRating, TempChart, fmtRest, estimate });

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
