server {
    listen       3000;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cross-origin isolation: with both headers on the document the page reports
    # self.crossOriginIsolated, which is what unlocks SharedArrayBuffer for
    # Voice Fill's threaded speech model.
    #
    # Declared here, at server level, so every location inherits them. Two nginx
    # rules to keep in mind when editing this file:
    #   - a location that declares ANY add_header of its own stops inheriting
    #     these. Adding one (a cache header, say) means repeating both there.
    #   - `always` sends them on error responses too (a 502 while the backend
    #     restarts, a 404); without it they are only added to 2xx/3xx.
    # Guarded by src/crossOriginIsolation.test.ts and, against the built image,
    # e2e/tests/cross-origin-isolation.spec.ts.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.IO (websocket) to backend for live temp events.
    # Frontend connects with io('') -> same origin, so the websocket upgrade
    # must be proxied here. Without this block the upgrade falls through to the
    # SPA fallback below and returns index.html, breaking live temps.
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files, fallback to index.html for SPA routing
    location / {
        try_files $uri /index.html;
    }
}

