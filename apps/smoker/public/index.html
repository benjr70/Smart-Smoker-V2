<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Smart Smoker</title>
    <style>
      /* The panel, painted before the application has run.
         Everything the touchscreen paints arrives as custom properties emitted
         by its bundle, so until that bundle has run there is nothing in the
         document painting anything — and the white page the flash consists of is
         painted anyway, on every boot and on every reload after the smoker's
         wifi came back.

         There is one scheme here, unlike the web application: this device is
         fixed dark, so the page needs neither a stored choice to read nor a
         media query to ask. The colour is the Carbon dark background, written
         out because the page has no bundle to read it from. Guarded by
         src/theme/preFirstPaint.test.tsx, which paints the served page in
         isolation and compares what comes out against the shared token set. */
      html {
        background-color: #0c0c0c;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
