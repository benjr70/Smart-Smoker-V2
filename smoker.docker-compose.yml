# Physical smoker device (Raspberry Pi, armv7l).
#
# Deployed once via the `Device Deploy` workflow (device_host: smoker,
# deploy_dir: /opt/smoker-device); after that Watchtower owns routine image
# updates, because the device is powered off most of the time and cannot be
# pushed to on a schedule. The operating rule:
#
#   image content changed  -> Watchtower picks it up on its next poll
#   this file changed      -> dispatch Device Deploy; Watchtower recreates
#                             containers from the *running container's* config
#                             and never re-reads this file
#
# Watchtower only ever sees a new image when `:latest` moves, and `:latest`
# moves only when a GitHub Release is published (nightly builds publish
# `:nightly`). Never deploy `:nightly` here — those bundles are built pointing
# at dev-cloud, so the device would look healthy while writing production cooks
# into the dev database.

# Pin the Compose project name. Without it the project is derived from the
# directory, so moving this file creates a *second* project whose containers
# collide with the running ones on `container_name` — which is exactly how the
# device ended up stranded on a stale runner checkout.
name: smoker-device

services:
  deviceService:
    container_name: device_service
    pull_policy: always
    restart: always
    privileged: true
    devices:
      # The Arduino is wired to the Pi's GPIO UART, not USB — see
      # apps/device-service/src/serial/serial.serivce.ts, which opens
      # /dev/ttyS0 in production mode. Docker validates this path when it
      # *creates* the container, so naming a node that does not exist breaks
      # every recreate — including the ones Watchtower performs, which would
      # take device_service down permanently.
      - /dev/ttyS0
    ports:
      - '3003:3003'
    network_mode: host
    volumes:
      - '/:/host'
      - '/var/run/dbus:/var/run/dbus'
    image: 'benjr70/smart-smoker-device-service:${VERSION:-latest}'
    healthcheck:
      # Probed with node, which is the image's runtime — the runtime stage is
      # node:20-bookworm-slim and ships neither curl nor wget, so the previous
      # `curl -f` check could only ever fail. The container reported unhealthy
      # for its whole life while the endpoint answered normally.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3003/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  frontend:
    container_name: frontend_smoker
    pull_policy: always
    restart: always
    image: 'benjr70/smart-smoker-smoker:${VERSION:-latest}'
    ports:
      - 8080:8080
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080']
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s
    logging: *default-logging

  electronShell:
    container_name: electron_shell
    pull_policy: always
    restart: always
    network_mode: host
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - '/tmp/.X11-unix:/tmp/.X11-unix'
      - '/run/dbus/system_bus_socket:/run/dbus/system_bus_socket'
      - '/etc/localtime:/etc/localtime:ro'
    environment:
      - DISPLAY=unix:0
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
    devices:
      - /dev/snd
      - /dev/dri:/dev/dri
    image: 'benjr70/smart-smoker-electron-shell:${VERSION:-latest}'
    healthcheck:
      # The Electron binary is `smoker-shell` (shell.dockerfile builds
      # smoker-shell-linux-armv7l), so `pgrep -x electron` never matched and
      # the kiosk always reported unhealthy. Matching the real process name
      # makes this a genuine liveness check: every Electron child (zygote,
      # renderer, utility) also runs under that name, so a crashed main
      # process still fails once its children are reaped.
      test: ['CMD-SHELL', 'pgrep -x smoker-shell >/dev/null || exit 1']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging

  watchtower:
    container_name: watchtower
    restart: always
    environment:
      # Only smoker-deploy.yml ever injected these, and that path is gone.
      # The images are public, so an unauthenticated pull is correct; the `:-`
      # defaults keep Compose from warning on every command. If these repos
      # ever go private, add /opt/smoker-device/.env (mode 600) on the device
      # rather than plumbing secrets through the deploy workflow.
      - REPO_USER=${REPO_USER:-}
      - REPO_PASS=${REPO_PASS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Scoped to the three application containers on purpose. Unscoped,
    # Watchtower also manages portainer_agent and *itself* — and an unattended
    # self-update on armv7 is the one failure that would remove the device's
    # ability to update anything else. Bump this image deliberately instead.
    command: --interval 300 --cleanup device_service frontend_smoker electron_shell
    # armhf-latest is an older client against Docker 24.0.5, which is the safe
    # direction for API negotiation. Do NOT copy virtual-smoker's `latest-dev`
    # tag — that one is amd64 and will not run here.
    image: containrrr/watchtower:armhf-latest
    # No healthcheck on purpose. The watchtower image is built FROM scratch —
    # it contains the static binary and CA certificates and nothing else, so
    # there is no shell and no pgrep for a check to run. Every probe failed to
    # exec, which reported the container unhealthy for its entire life. Docker
    # shows no health state at all without this block, which is the honest
    # answer; watchtower's own liveness is visible in its logs ("Session done
    # ... Scanned=3"), and restart: always covers a crash.
    logging: *default-logging
