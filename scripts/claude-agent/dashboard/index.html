<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smoker Agents</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --line: #21262d; --fg: #e6edf3;
    --dim: #8b949e; --green: #3fb950; --amber: #d29922; --red: #f85149;
    --blue: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px; max-width: 640px; margin: 0 auto;
  }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.green { background: var(--green); } .dot.amber { background: var(--amber); }
  .dot.red { background: var(--red); }
  header h1 { font-size: 18px; font-weight: 600; flex: 1; }
  #updated { color: var(--dim); font-size: 12px; }
  #stale {
    display: none; background: #4d1f1f; color: #ffb3b3; border-radius: 8px;
    padding: 6px 10px; font-size: 13px; margin-bottom: 10px;
  }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tile .label { color: var(--dim); font-size: 12px; }
  .tile .num { font-size: 28px; font-weight: 700; margin: 2px 0; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 4px 0; }
  .bar span { display: block; height: 100%; background: var(--green); }
  .tile .sub { color: var(--dim); font-size: 11px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin-bottom: 12px;
  }
  .card h2 { font-size: 13px; color: var(--dim); font-weight: 600; text-transform: uppercase;
             letter-spacing: .04em; margin-bottom: 8px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px;
    font-weight: 600; background: var(--line);
  }
  .badge.green { background: #1a3d24; color: var(--green); }
  .badge.amber { background: #3d321a; color: var(--amber); }
  .badge.red { background: #3d1a1a; color: var(--red); }
  .badge.blue { background: #1a2a3d; color: var(--blue); }
  .kv { color: var(--dim); font-size: 13px; margin-top: 6px; word-break: break-word; }
  .kv b { color: var(--fg); font-weight: 600; }
  .chip {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    background: var(--line); color: var(--dim); margin: 2px 2px 0 0;
  }
  .chip.amber { background: #3d321a; color: var(--amber); }
  .chip.red { background: #3d1a1a; color: var(--red); }
  .pr { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .pr:first-of-type { border-top: 0; }
  .fire { border-top: 1px solid var(--line); font-size: 13px; }
  .fire:first-of-type { border-top: 0; }
  .fire summary {
    display: flex; gap: 8px; align-items: baseline; padding: 8px 0;
    cursor: pointer; list-style: none;
  }
  .fire summary::-webkit-details-marker { display: none; }
  .fire .t { color: var(--dim); flex: none; font-size: 12px; width: 88px; }
  .fire .s { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fire[open] .s { white-space: normal; }
  .fire .steps { color: var(--dim); font-size: 12px; padding: 0 0 8px 96px; }
  .fire .steps div { word-break: break-word; }
  .pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .err { color: var(--red); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>Smoker Agents</h1>
  <span id="updated">…</span>
</header>
<div id="stale"></div>

<div class="tiles" id="tiles"></div>

<div class="card">
  <h2>Daemon</h2>
  <div id="daemon">loading…</div>
</div>

<div class="card" id="fireCard" style="display:none">
  <h2>Current fire</h2>
  <div id="fire"></div>
</div>

<div class="card">
  <h2>Open PRs</h2>
  <div id="prs">loading…</div>
</div>

<div class="card">
  <h2>Last fires</h2>
  <div id="fires">loading…</div>
</div>

<script>
let data = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pctColor = p => p == null ? "var(--dim)" :
  p < 60 ? "var(--green)" : p < 85 ? "var(--amber)" : "var(--red)";

function until(iso) {
  if (!iso) return "";
  const ms = new Date(iso) - Date.now();
  if (isNaN(ms)) return "";
  if (ms <= 0) return "now";
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return `${d}d ${h % 24}h`;
  if (h >= 1) return `${h}h ${m % 60}m`;
  return `${m}m ${Math.floor(ms / 1000) % 60}s`;
}
function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 1000));
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (h >= 1) return `${h}h ${m % 60}m`;
  if (m >= 1) return `${m}m ${s % 60}s`;
  return `${s}s`;
}

const STATE_LABELS = {
  firing: ["Firing", "green", "agent-run in flight"],
  run_complete: ["Between fires", "green", "re-checking budget"],
  sleeping: ["Sleeping", "blue", "until window reset"],
  queue_empty: ["Queue empty", "blue", "probing for work"],
  woke_early: ["Woke early", "green", "work appeared"],
  exhausted: ["Exhausted", "amber", "usage window spent"],
  run_failed: ["Fire failed", "amber", "probe-sleeping, will retry"],
  fail_cap: ["Fail cap", "red", "deaf until window reset"],
  budget_poll: ["Waiting on budget", "blue", "polling for fresh window"],
  degraded: ["Sensor degraded", "red", "no usage signal"],
  boot: ["Starting", "blue", ""],
  unknown: ["Unknown", "", ""],
};

function render() {
  if (!data) return;

  // tiles
  const u = data.usage || {};
  let tiles = "";
  for (const t of u.tiles || []) {
    tiles += `<div class="tile">
      <div class="label">${esc(t.label)}</div>
      <div class="num" style="color:${pctColor(t.percent)}">${t.percent == null ? "—" : Math.round(t.percent) + "%"}</div>
      <div class="bar"><span style="width:${Math.min(100, t.percent || 0)}%;background:${pctColor(t.percent)}"></span></div>
      <div class="sub">resets in ${until(t.resetsAt) || "?"}</div>
    </div>`;
  }
  const g = u.gate;
  if (g) {
    const col = g.shouldFire ? "var(--green)" : "var(--red)";
    tiles += `<div class="tile">
      <div class="label">Daemon gate · budget left</div>
      <div class="num" style="color:${col}">${g.remainPct}%</div>
      <div class="bar"><span style="width:${g.remainPct}%;background:${col}"></span></div>
      <div class="sub">${g.shouldFire ? "firing allowed" : "below " + g.threshold + "% — holds"}</div>
    </div>`;
  }
  document.getElementById("tiles").innerHTML =
    tiles + (u.error ? `<div class="err">usage: ${esc(u.error)}</div>` : "");

  // daemon card + header dot
  const d = data.daemon || {};
  const [label, color, hint] = STATE_LABELS[d.state] || STATE_LABELS.unknown;
  const dot = document.getElementById("dot");
  dot.className = "dot " + (
    d.unit?.active !== "active" ? "red" :
    color === "red" ? "red" : color === "amber" ? "amber" : "green");
  let dh = `<span class="badge ${color}">${label}</span>`;
  if (d.fail) dh += ` <span class="badge amber">fail ${d.fail.count}/${d.fail.cap}</span>`;
  if (d.unit?.active !== "active")
    dh += ` <span class="badge red">unit: ${esc(d.unit?.active)}</span>`;
  dh += `<div class="kv">${esc(d.stateDetail || hint)}</div>`;
  const s = d.sensor;
  if (s) {
    dh += `<div class="kv">sensor <b>${esc(s.sensor)}</b> · remaining <b>${s.remainPct}%</b>` +
      (s.resetAt ? ` · resets in <b>${until(s.resetAt)}</b>` : "") +
      ` <span style="font-size:11px">(read ${ago(s.at)} ago)</span></div>`;
  }
  if (d.error) dh += `<div class="err">${esc(d.error)}</div>`;
  document.getElementById("daemon").innerHTML = dh;

  // current fire
  const cur = (data.fires || {}).current;
  const fc = document.getElementById("fireCard");
  if (cur) {
    fc.style.display = "";
    const scan = (data.pipeline || {}).scan || {};
    let chips = "";
    if (scan.locked) chips += `<span class="chip amber">team:in-progress lock held</span>`;
    if (scan.reconcile) chips += `<span class="chip amber">reconcile PR #${scan.reconcile}</span>`;
    if (scan.paused) chips += `<span class="chip">paused #${scan.paused}</span>`;
    if (scan.pickSig) chips += `<span class="chip">queue: #${esc(scan.pickSig)}</span>`;
    document.getElementById("fire").innerHTML =
      `<span class="badge green pulse">running</span>
       <span class="kv"> ${esc(cur.id)} · <b>${ago(cur.startedAt)}</b> elapsed</span>
       <div class="kv">${esc(cur.summary !== "in flight" ? cur.summary : "output arrives when the fire completes")}</div>
       <div>${chips}</div>` +
      ((data.pipeline || {}).error ? `<div class="err">pipeline: ${esc(data.pipeline.error)}</div>` : "");
  } else {
    fc.style.display = "none";
  }

  // open PRs
  const prs = (data.openPrs || {}).items || [];
  document.getElementById("prs").innerHTML = (prs.length ? prs.map(p => {
    let chips = p.labels.map(l =>
      `<span class="chip ${l === "team:revise" ? "amber" : l.startsWith("team:") ? "red" : ""}">${esc(l)}</span>`).join("");
    if (p.mergeable === "CONFLICTING") chips += `<span class="chip red">conflict</span>`;
    if (p.isDraft) chips += `<span class="chip">draft</span>`;
    return `<div class="pr"><b>#${p.number}</b> ${esc(p.title)}<br>${chips}</div>`;
  }).join("") : `<div class="kv">none</div>`) +
    ((data.openPrs || {}).error ? `<div class="err">${esc(data.openPrs.error)}</div>` : "");

  // fire history
  const fires = (data.fires || {}).items || [];
  document.getElementById("fires").innerHTML = (fires.length ? fires.map(f => {
    const badge = f.inFlight ? `<span class="badge green pulse">live</span>` :
      f.exit === 0 ? (f.noWork ? `<span class="badge">idle</span>` : `<span class="badge green">ok</span>`) :
      `<span class="badge red">exit ${f.exit}</span>`;
    const t = new Date(f.startedAt).toLocaleString([], { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    const steps = Object.entries(f.steps || {}).map(([k, v]) =>
      `<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join("");
    return `<details class="fire"><summary>
        <span class="t">${esc(t)}</span><span class="s">${esc(f.summary)}</span>${badge}
      </summary>${steps ? `<div class="steps">${steps}</div>` : ""}</details>`;
  }).join("") : `<div class="kv">no fires yet</div>`) +
    ((data.fires || {}).error ? `<div class="err">${esc(data.fires.error)}</div>` : "");
}

async function refresh() {
  try {
    const resp = await fetch("/api/status");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    data = await resp.json();
    document.getElementById("stale").style.display = "none";
  } catch (e) {
    const el = document.getElementById("stale");
    el.textContent = "connection lost — showing last data (" + e.message + ")";
    el.style.display = "block";
  }
  render();
  document.getElementById("updated").textContent =
    data ? "updated " + ago(data.generatedAt) + " ago" : "no data";
}

refresh();
setInterval(refresh, 10000);
setInterval(() => {   // tick countdowns between fetches
  if (!data) return;
  render();
  document.getElementById("updated").textContent = "updated " + ago(data.generatedAt) + " ago";
}, 1000);
</script>
</body>
</html>
